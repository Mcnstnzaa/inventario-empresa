{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header fs-5">📦 Registrar Entrada de Mercadería</div>
            <div class="card-body">
                <form method="POST" action="/agregar_stock">
                    <div class="mb-3">
                        <label class="form-label">Seleccionar Producto</label>
                        <select name="producto_id" class="form-select" required>
                            <option value="" disabled selected>-- Elige un producto --</option>
                            {% for p in productos %}
                            <option value="{{ p['id'] }}">{{ p['nombre'] }} (Stock actual: {{ p['cantidad'] }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Cantidad que ingresó</label>
                        <input type="number" name="cantidad" class="form-control" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-gold w-100">Registrar Entrada</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
