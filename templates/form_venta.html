{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header fs-4 text-warning">💰 Registrar Venta</div>
            <div class="card-body">
                <form method="POST" action="/accion">
                    <input type="hidden" name="tipo" value="venta">
                    
                    <label class="form-label text-warning">Fecha de la Venta</label>
                    <input type="date" name="fecha_accion" class="form-control mb-3" value="{{ fecha_hoy }}" required>

                    <label class="form-label text-warning">1. Selecciona la Categoría</label>
                    <select id="cat_venta" class="form-select mb-3" onchange="filtrarProductos('venta')" required>
                        <option value="" disabled selected>-- Elige Categoría --</option>
                        {% for c in categorias %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>

                    <label class="form-label text-warning">2. Selecciona el Producto</label>
                    <select name="producto_id" id="prod_venta" class="form-select mb-3" required disabled onchange="actualizarPrecio()">
                        <option value="" disabled selected>-- Primero elige una categoría --</option>
                        {% for p in productos %}
                        <option value="{{ p['id'] }}" data-categoria="{{ p['categoria'] }}" data-precio="{{ p['precio'] }}">{{ p['nombre'] }} (Stock: {{ p['cantidad'] }})</option>
                        {% endfor %}
                    </select>

                    <div class="row">
                        <div class="col-md-6">
                            <label class="form-label text-warning">3. Cantidad vendida</label>
                            <input type="number" name="cantidad" class="form-control mb-3" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <!-- AQUI ESTA LA CASILLA PARA MODIFICAR EL PRECIO -->
                            <label class="form-label text-warning">4. Precio Final ($)</label>
                            <input type="number" step="0.01" name="precio_venta" id="precio_venta" class="form-control mb-3" required>
                        </div>
                    </div>

                    <label class="form-label text-warning">5. Método de Pago</label>
                    <select name="metodo_pago" class="form-select mb-4" required>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="Débito">Débito</option>
                        <option value="Crédito">Crédito</option>
                    </select>
                    
                    <button type="submit" class="btn btn-warning w-100 mb-2">Restar del Stock</button>
                    <a href="/menu" class="btn btn-outline-secondary w-100">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function filtrarProductos(tipo) {
    var catSeleccionada = document.getElementById('cat_' + tipo).value;
    var selectProductos = document.getElementById('prod_' + tipo);
    selectProductos.innerHTML = '<option value="" disabled selected>-- Elige Producto --</option>';
    selectProductos.disabled = false;
    
    var opcionesOriginales = selectProductos.getAttribute('data-opciones');
    if(!opcionesOriginales) {
        var opciones = '';
        {% for p in productos %}
        opciones += '<option value="{{ p['id'] }}" data-categoria="{{ p['categoria'] }}" data-precio="{{ p['precio'] }}">{{ p['nombre'] }} (Stock: {{ p['cantidad'] }})</option>';
        {% endfor %}
        selectProductos.setAttribute('data-opciones', opciones);
        opcionesOriginales = opciones;
    }
    
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = opcionesOriginales;
    var opcionesFiltradas = tempDiv.querySelectorAll('option[data-categoria="' + catSeleccionada + '"]');
    
    if(opcionesFiltradas.length === 0) {
        selectProductos.innerHTML = '<option value="" disabled selected>-- No hay productos en esta categoría --</option>';
    } else {
        opcionesFiltradas.forEach(function(opcion) {
            selectProductos.appendChild(opcion.cloneNode(true));
        });
    }
    document.getElementById('precio_venta').value = ''; // Limpiar precio anterior
}

// Esta función carga el precio del producto automáticamente al seleccionarlo
function actualizarPrecio() {
    var selectProductos = document.getElementById('prod_venta');
    var precioInput = document.getElementById('precio_venta');
    
    if (selectProductos.selectedIndex >= 0) {
        var precio = selectProductos.options[selectProductos.selectedIndex].getAttribute('data-precio');
        if(precio) {
            precioInput.value = precio;
        }
    }
}
</script>
{% endblock %}
